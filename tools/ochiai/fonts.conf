<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- PDF 変換時（LibreOffice）に Meiryo が無い環境で日本語グリフのフォントへ置き換える -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same">
    <family>Meiryo</family>
    <prefer><family>IPAPGothic</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
</fontconfig>
