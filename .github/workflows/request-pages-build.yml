# 分野ブランチ（field.json を持つブランチ）と学会ブランチ（conferences.json を持つブランチ）に push されたら、
# サイト生成ワークフロー（pages.yml）を既定ブランチ上で起動する。Pages の公開は既定ブランチからしか許可されないため。
name: Request site rebuild

on:
  push:
    branches-ignore: [main]

permissions:
  actions: write
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            field.json
            conferences.json
          sparse-checkout-cone-mode: false
      - name: Trigger pages.yml on the default branch
        if: hashFiles('field.json') != '' || hashFiles('conferences.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
